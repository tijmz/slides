        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

## Visible learning trajectories

<split gap="3">

<div style="flex:none;width:443.52px;margin-left:4.48px;font-size:0.86em;align-self:center;margin-top:6.8px">

- Visible Learning Trajectories is a methodical approach to curriculum design
- It works by inserting **learning trajectory objectives** into the constructive alignment of educational components
- Once completed, this affords easier redesign

</div>

<img src="Assets/vlt-alignment-scheme-4.png" alt="" style="width: 416px; object-fit: fill">


</split>

<aside class="notes"><p>The Visible Learning Trajectories programme at UvA is an existing methodology, that most bachelor programmes and some master programmes have implemented. It works by adding a constructive alignment layer between courses and exit qualifications, using the same logic as course objectives to, but then formulated at the achievement level of the programme. Multiple course objectives together lead to achievement of the learning trajectory objective. The method is more elaborate than this, but for now the key thing is that it leads to curricula in which alignment both complete and visible. This affords focused adaptation of the curriculum.</p>
</div></aside></script></section><section data-separator="?

<split gap="3">

<div style="flex:none;width:443.52px;margin-left:4.48px;font-size:0.86em;align-self:center;margin-top:6.8px">

- Joint project of VLT programme and TLC Science
- Programmes with VLT implementation can join this thematic track on GenAI integration
- GenAI is changing not only what students need to know and master, but also how they learn, work, and develop as professionals
- This affects curricula across levels

</div>

<div style="flex:none;margin-left:-64.8px">

<img src="Assets/vlt-alignment-genai-d.png" alt="" style="width: 481px; object-fit: fill">


</div>

</split>

<aside class="notes"><p>And of course adaptation is necessary due to GenAI. If you look at the whole ladder of constructive alignment, you can see GenAI impact each step. (Yes, technically learning activities are not &#39;below&#39; assessment forms).</p>
</div></aside></script></section><section ><section data-separator="?

## Towards a vision on GenAI

<img src="Assets/vlt-session-setup.png" alt="" style="width: 880px; object-fit: fill">


<aside class="notes"><p>Here&#39;s the setup for a three-hour session. Programmes first draft a profile of their graduate in 2030. They then deliberate on the three key issues, keeping that profile in mind - any changes to the curriculum should be oriented towards their profile, which is a rough mental model of exit qualifications. Next, on the basis of their deliberation, they vote for positions and important considerations, and everything is translated into a draft vision.</p>
</div></aside></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Three key issues for programmes

<!-- TODO visual: tree diagram. Root: "Issues to consider when deciding about GenAI use in an educational programme" with three branches below -->

1. Do we want GenAI-specific learning trajectory objectives?
2. Do we want to alter the assessment structure in response to GenAI?
3. Do we want to employ GenAI as a means to enhance learning?

<aside class="notes"><p>These are the questions we&#39;ve seen pop up in teacher teams. They are not all the questions one could pose, but they are the ones that complicate strategic planning if left unanswered. They have to do with what the team <em>wants</em> for the programme at the shared level. Developing a vision comes down to reaching mutual agreement on at least these three issues.</p>
</div></aside></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" data-visibility="hidden" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Issue 1: Do we want GenAI-specific learning trajectory objectives?

Are there knowledge and skills related to GenAI that are important enough to set as **goals achieved by the curriculum as a whole**?

Consider:

- What are risks and opportunities of GenAI within the field?
- Should we teach critical evaluation of GenAI output?
- Should we teach transparent and responsible use of GenAI?
- Should our graduates have basic understanding of GenAI principles?

<aside class="notes"></div></aside></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: style="font-size: 0.85em" class="drop" data-visibility="hidden" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Issue 2: Do we want to alter assessment structure in response to GenAI?

How can assessment remain valid and meaningful in a context where GenAI is widely available?

Consider:

- What do we truly wish to assess?
- Which assessment forms are appropriate, given specific ILOs and the availability of GenAI?
- How can assessment make learning processes, choices, and reflections visible (not just outcomes)?
- How can the use of GenAI become a transparent and accountable part of academic work?
- How do the different assessment forms within our programme relate to each other?
- Which assessment designs encourage responsible and reflective use of GenAI, rather than avoidance or outsourcing?
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" data-visibility="hidden" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Issue 3: Do we want to employ GenAI as a means to enhance learning?

When can GenAI contribute to student learning?

Consider:

- Could GenAI be used to complement teaching?
- Which risks could GenAI pose for learning?
- How can we assure “productive friction”?
- Could GenAI provide novel, valuable learning experiences?
- Could GenAI help with scaffolding?
</div></script></section><section data-separator="?

## Rotating along the issues

<aside class="notes"><p>The way we do that is to have all three issues in distinct corners of the room, on whiteboards. The team is split into three and Groups rotate along the three boards (click to advance). Each number starts at one issue and rotates twice, so every group meets every issue once and brainstorms reasons for and against the position. After these deliberative steps, everybody gets to vote for a position and for reasons - which means we might see most votes for a YES position, but with strong weight on a set of NO-reasons - the voice of the minority we should also bring into the vision.</p>
</div></aside></script></section><section data-separator="?

## We will do it differently

<!-- TODO visual: flow diagram. 2030 profile + Issue deliberation + Voting for positions and reasons → Vision -->

- We will skip on the 2030 profile
- We will only _pretend_ to be a programme
- We will not rotate along the issues
- But we will discuss all issues in groups and then go through the voting process
</div>

<aside class="notes"><p>we don&#39;t have three hours. we don&#39;t even have a programme! so we will skip on some portions and only do one round of the rotation before we vote. This gives you a taste of the process.</p>
</aside></script></section><section data-separator="?

## Let’s collect thoughts

### Deliberation

- We have boards for the different issues, stated as a position
- For each board, a group thinks of several *reasons* in favour or against the position. Per person:
  - Formulate at least one **yes, because…**
  - Formulate at least one **no, because…**
- Each board needs a **facilitator** to make sure everyone is heard
- See handout for talking points to help with deliberation
- Focus on brainstorming reasons, not resolving debates!
- After six minutes, we share the reasons

<aside class="notes"><p>We&#39;re a large group, so this setup is mostly there to make sure everybody is heard at each board.</p>
</div></aside></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Let’s collect thoughts

### Facilitating a board

- Your role: make sure everyone is heard, and keep the focus on **reasons, not debate**
- Write each reason on the board in the speaker’s own words, and check it back
- If a reason triggers an argument, park it: capture the counterpoint as a new reason and move on
- Invite the quieter voices: *what haven’t we heard yet?*
- Keep an eye on the time, so there is room to share the reasons

<aside class="notes"><p>Three boards, three facilitators, about eight or nine people per board. At this scale, facilitation is what keeps the deliberation inclusive.</p>
</div></aside></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Let’s collect thoughts

### Voting instructions

- For each issue, vote for the **position** (yes or no) you currently lean towards
  - You do not have to *fully* agree, vote for what feels most workable now
- Then, vote for the **three reasons** you find most important, regardless of their column
  - Distribute your votes as you wish (one per reason)

<aside class="notes"><p>You can vote for reasons that do not support your position, but that you find important nonetheless.</p>
</div></aside></script></section><section data-separator="?

## Let’s collect thoughts

- What stands out if we consider the various reasons and votes?
- Is there a pattern to the answers?
- Does this reveal tensions or dilemmas?
- Which concerns/positions need to be explicit in a vision on GenAI?

# Follow-up steps

## Learning trajectory objectives

- Distinguish between **theoretical** and **operational** LTOs
- Pick courses that (could) support achievement of these LTOs
- Develop ILOs and learning activities in these courses
</div>

<aside class="notes"><p>what happens next depends on the outcome of the vision. If a programme wants learning trajectory objectives for AI, we help to develop those. We distinguish theoretical goals (knowing about AI) and operational goals (knowing how to use AI). these are formulated for the specific programme and aligned with courses - meaning there will also be new course objectives.</p>
</aside></script></section><section ><section data-separator="?

<div style="font-size:0.88em;width:calc(309px + var(--ov));margin-left:3.84px">

- Analyse course assessment: is assessment in Lane 1 (supervised) , Lane 2 (unsupervised) or both?
- Inspect whether **LTOs** are adequately assessed at a programme level
- Feed the macro view back into micro development
- Develop assessment forms with new best practices

## Follow-up steps

### GenAI as means

- Working from course-level intended learning outcomes
- Identify the _learning_ that is required per ILO and its corresponding "productive friction"
- Design learning tools around maintenance of productive friction

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
