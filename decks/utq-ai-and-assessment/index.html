    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

# You cannot reliably tell by looking at products

- Sometimes GenAI use is very obvious, but it does not have to be
- Even if it is, the Examinations Board can struggle to prove it
- Promises by companies selling AI detection software fall short in practice
- False positives of detection software target those with weaker language proficiency or unique styles
- AI detection software co-evolves with "humanisers"

We can still **set** norms surrounding GenAI use, but should be mindful that we cannot **enforce** them outside of the classroom.
</div></script></section><section data-separator="?

en')"><b>Diagnostic test</b><br>A test given before or at the start of a course to establish students&#x27; prior knowledge or skills.</div></details><details class="mapc" name="mapd" style="left:192.3px;top:185.1px;width:131.3px;height:47.7px"><summary class="mapchip">Logbook or journal</summary><div class="mapdesc" style="left:-79.3px;top:0.0px" onclick="this.parentNode.removeAttribute('open')"><b>Logbook or journal</b><br>A regular written record in which students document activities, progress, observations, and reflections over time.</div></details><details class="mapc" name="mapd" style="left:55.0px;top:240.9px;width:131.3px;height:47.7px"><summary class="mapchip">Low-stakes quiz</summary><div class="mapdesc" style="left:-49.0px;top:0.0px" onclick="this.parentNode.removeAttribute('open')"><b>Low-stakes quiz</b><br>A short quiz, usually administered during or alongside a course, with limited consequences for the final grade.</div></details><details class="mapc" name="mapd" style="left:192.3px;top:296.6px;width:131.3px;height:47.7px"><summary class="mapchip">Homework<br>assignment</summary><div class="mapdesc" style="left:-79.3px;top:-8.6px" onclick="this.parentNode.removeAttribute('open')"><b>Homework assignment</b><br>An individual task that students complete outside scheduled class time.</div></details><details class="mapc" name="mapd" style="left:329.7px;top:352.3px;width:131.3px;height:47.7px"><summary class="mapchip">Programmatic<br>assessment</summary><div class="mapdesc" style="left:-79.3px;top:-64.3px" onclick="this.parentNode.removeAttribute('open')"><b>Programmatic assessment</b><br>An assessment approach that combines multiple assessment activities and feedback moments over a longer period.</div></details><details class="mapc" name="mapd" style="left:467.0px;top:352.3px;width:131.3px;height:47.7px"><summary class="mapchip">Two-step<br>assessment</summary><div class="mapdesc" style="left:-79.3px;top:-64.3px" onclick="this.parentNode.removeAttribute('open')"><b>Two-step assessment</b><br>An assessment in which students submit a first version, receive feedback, and then submit a revised version.</div></details><details class="mapc" name="mapd" style="left:467.0px;top:296.6px;width:131.3px;height:47.7px"><summary class="mapchip">Take home exam</summary><div class="mapdesc" style="left:-79.3px;top:-8.6px" onclick="this.parentNode.removeAttribute('open')"><b>Take home exam</b><br>An individual exam that students complete outside the classroom and submit within a specified time period.</div></details><details class="mapc" name="mapd" style="left:604.3px;top:240.9px;width:131.3px;height:47.7px"><summary class="mapchip">Peer-assessment</summary><div class="mapdesc" style="left:-79.3px;top:0.0px" onclick="this.parentNode.removeAttribute('open')"><b>Peer-assessment</b><br>A process in which students assess and provide feedback on the work or contribution of other students.</div></details><details class="mapc" name="mapd" style="left:741.7px;top:240.9px;width:131.3px;height:47.7px"><summary class="mapchip">Creative assignment<br>(poster, blog, video,<br>website, podcast)</summary><div class="mapdesc" style="left:-153.7px;top:0.0px" onclick="this.parentNode.removeAttribute('open')"><b>Creative assignment (poster, blog, video, website, podcast)</b><br>An assignment in which students create an original product in a chosen format to communicate content, ideas, or findings.</div></details><details class="mapc" name="mapd" style="left:604.3px;top:296.6px;width:131.3px;height:47.7px"><summary class="mapchip">Project report /<br>minithesis</summary><div class="mapdesc" style="left:-79.3px;top:-8.6px" onclick="this.parentNode.removeAttribute('open')"><b>Project report / minithesis</b><br>A relatively short academic paper in which students investigate a focused research question.</div></details><details class="mapc" name="mapd" style="left:741.7px;top:296.6px;width:131.3px;height:47.7px"><summary class="mapchip">Group project</summary><div class="mapdesc" style="left:-153.7px;top:-8.6px" onclick="this.parentNode.removeAttribute('open')"><b>Group project</b><br>A project completed by two or more students who jointly produce a shared outcome.</div></details><details class="mapc" name="mapd" style="left:604.3px;top:352.3px;width:131.3px;height:47.7px"><summary class="mapchip">Portfolio</summary><div class="mapdesc" style="left:-79.3px;top:-64.3px" onclick="this.parentNode.removeAttribute('open')"><b>Portfolio</b><br>A curated collection of work samples and supporting materials submitted by a student.</div></details></div></div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

# Two-lane approach

| **Lane 1**<br>Secured assessment                                                                                                                                         | **Lane 2**<br>AI-aware assessment                                                                                                                       |
| ------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------- |
| • Proctored / on-site assessment<br>• AI use is limited and monitored<br>• All results measure individual competences<br>• AI possibly allowed during _learning process_ | • Open, non-proctored assignments (e.g. authentic or take-home assessment)<br>• Where relevant, AI may be used, preferably with support and scaffolding |

"></circle><text x="825" y="107" text-anchor="middle" font-size="19" font-weight="700" fill="#bc0031">2</text><circle cx="825" cy="190" r="17" fill="#fff" stroke="#4a4a4a" stroke-width="6"></circle><text x="825" y="197" text-anchor="middle" font-size="19" font-weight="700" fill="#4a4a4a">2</text><circle cx="825" cy="280" r="17" fill="#fff" stroke="#5f7ea3" stroke-width="6"></circle><text x="825" y="287" text-anchor="middle" font-size="19" font-weight="700" fill="#5f7ea3">2</text><text x="825" y="346" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Capstone</text><circle cx="112" cy="388" r="9" fill="#fff" stroke="#6b6b6b" stroke-width="4"></circle><text x="128" y="393" font-size="15" fill="#6b6b6b">assessed in Lane 2</text><circle cx="318" cy="388" r="9" fill="#6b6b6b" stroke="#6b6b6b" stroke-width="3"></circle><text x="334" y="393" font-size="15" fill="#6b6b6b">assessed in Lane 1</text><rect x="520" y="374" width="22" height="28" rx="11" fill="#fff" stroke="#1a1a1a" stroke-width="3"></rect><text x="552" y="393" font-size="15" fill="#6b6b6b">course contributing to several ILOs</text></svg>
<div class="fragment cur-layer"><svg viewBox="0 0 884 400" class="cur-svg"><circle cx="150" cy="190" r="30" fill="none" stroke="#bc0031" stroke-width="4"></circle><circle cx="420" cy="100" r="30" fill="none" stroke="#bc0031" stroke-width="4"></circle><circle cx="690" cy="280" r="30" fill="none" stroke="#bc0031" stroke-width="4"></circle></svg><div class="cur-cap">If an ILO is assessed in Lane 1 in some courses, it does not matter that other courses assess it solely in Lane 2</div></div></div>

<aside class="notes"><p>Think of the curriculum as a metro map: each ILO is a line, each course a station. Courses that contribute to several ILOs are interchanges. A filled circle means the ILO is assessed in Lane 1 in that course, a hollow circle means Lane 2. What matters for robustness is that each ILO is assessed in Lane 1 at least somewhere along its line (ideally towards the end). Lane 2 only assessment in the other courses on the same line is then fine.</p>
</div></aside></script></section><section data-separator="?

# UvA implementation

<div class="zoom-text uva-text">
<div class="uva-step"><span class="uva-tag">Original idea</span>Lane 2 also exists to train AI skills (Liu &amp; Bridgeman, 2023)</div>
<div class="uva-step"><span class="uva-tag">The catch</span>What if you dislike promoting AI use, but still want to use Lane 2 assessment?</div>

<div class="uva-step"><span class="uva-tag">Learning trajectories</span>At programme-level, each LTO should be assured in Lane 1 at least once</div>

# Switching lanes

<div class="lsw"><div class="lsw-stage">
<div class="lsw-box lsw-lever lsw-ilo"><span class="lsw-t">ILO</span><span class="lsw-s">intended learning outcome</span></div>
<div class="lsw-box lsw-lever lsw-ass"><span class="lsw-t">Assessment</span><span class="lsw-chip"><span>Assessment form</span><b class="lsw-tag">⇄</b></span><span class="lsw-chip"><span>Grading criteria</span><b class="lsw-tag">⇄</b></span><span class="lsw-chip lsw-chip-w"><span>Weights of the criteria</span><b class="lsw-tag">%</b><i>discount criteria or set minimum scores for criteria</i></span></div>
<div class="lsw-legend"><span class="lsw-tag">⇄</span> can switch lane<br><span class="lsw-tag lsw-tag-g">%</span> can discount criteria</div>
<div class="fragment lsw-layer"><svg viewBox="0 0 560 480" class="lsw-svg"><defs><marker id="lswa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc0031"></path></marker></defs><line x1="340" y1="230" x2="400" y2="356" stroke="#bc0031" stroke-width="4" stroke-linecap="round" marker-start="url(#lswa)" marker-end="url(#lswa)"></line></svg><div class="lsw-pill"><span class="lsw-t">Alignment</span><span class="lsw-s">re-check after each change</span></div></div>
<div class="fragment lsw-layer"><svg viewBox="0 0 560 480" class="lsw-svg"><defs><marker id="lswb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"></path></marker></defs><line x1="150" y1="230" x2="96" y2="354" stroke="#6b6b6b" stroke-width="4" stroke-linecap="round" marker-start="url(#lswb)" marker-end="url(#lswb)"></line><line x1="196" y1="402" x2="296" y2="402" stroke="#6b6b6b" stroke-width="4" stroke-linecap="round" marker-start="url(#lswb)" marker-end="url(#lswb)"></line></svg><div class="lsw-box lsw-teach"><span class="lsw-t">Teaching</span><span class="lsw-s">learning activities</span></div></div>
<div class="fragment lsw-layer"><div class="lsw-divider"></div><div class="lsw-eyebrow">Example: essay with progress meetings</div><div class="lsw-form lsw-fe"><div class="lsw-fh"><span class="lsw-ft">Essay</span><span class="lsw-badge">Lane 2</span></div><span class="lsw-chip lsw-chip-ghost"><span>Critical thinking</span></span><span class="lsw-chip lsw-chip-plain"><span>Other criteria</span></span></div></div>
<div class="fragment lsw-layer"><svg viewBox="0 0 884 480" class="lsw-svg lsw-svg-wide"><defs><marker id="lswc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc0031"></path></marker></defs><line x1="700" y1="208" x2="700" y2="286" stroke="#bc0031" stroke-width="4" stroke-linecap="round" marker-end="url(#lswc)"></line></svg><div class="lsw-mv"><span class="lsw-tag">⇄</span> moves to Lane 1</div><div class="lsw-form lsw-fm"><div class="lsw-fh"><span class="lsw-ft">Progress meeting</span><span class="lsw-badge">Lane 1</span></div><span class="lsw-chip"><span>Critical thinking</span></span></div><div class="lsw-cap">Or framed differently: a new assessment form, the progress meeting, in Lane 1</div></div>
</div></div>

<aside class="notes"><p>ILO = intended learning outcome. The red-outlined boxes are what can change when you switch lanes: the ILO and, within the assessment, the form, the grading criteria and the weights. The assessment form and the grading criteria can each switch lanes (a form can even be split: some criteria in Lane 1, others in Lane 2, see next slide). The weights do not switch lanes, but you can discount criteria (lower the weight of criteria that are less valid for the ILO) or set minimum scores for criteria (e.g. for the most valid criteria, such as Lane 1 criteria, to make the assessment form robust against GenAI use). All of these interact, so after any change re-check that the ILO and the assessment still align. Teaching is affected too (slide after next). Example: an essay with progress meetings. Critical thinking used to be assessed on the essay (Lane 2). It now becomes part of the progress meeting (Lane 1). You could also frame this as a new assessment form, the progress meeting, in Lane 1: that is a matter of framing. A switch can go both ways, Lane 1 to Lane 2 and Lane 2 to Lane 1 (see the hidden backup slide at the end).</p>
</div></aside></script></section><section data-separator="?

<div class="fcard"><div class="fhead"><div><span class="fs">Option 3</span><span class="ft">Set a minimum</span></div></div><p class="lsp-p">Require a minimum for the most valid criteria, e.g. for Lane 1 criteria to make the assessment form robust against GenAI use</p></div>
</div>
</div>

# Introducing novel assessment

<div class="tri-text">

- We have now gone through analytical steps, preparing us to ideate new assessment forms
- These assessment forms should be aligned with specific ILOs, but also with your teaching!
- GenAI prompts a particular mode of teaching:
	- Knowing where students are at and what they need for learning
	- Modelling the process of (critical) enquiry and creative intellectual work

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }
