    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

### Qualification

- Education *certifies* skills and knowledge with their degrees
- **Assessment** is the way to assure the certificate is valid
- But GenAI can invalidate assessment forms (especially the fun ones)
- *And* GenAI use may hinder student learning towards their qualification 
	- e.g. by bypassing productive struggle or desirable difficulties
</div></script></section><section data-separator="

### Socialisation

- Students learn behaviours/norms/values relevant to a (professional) group
- E.g. the way to discuss topics during seminars, how to reason about problems
- This typically requires active experiences with peers and teachers
- Clashes with "personalised tutors"
</div></script></section><section data-separator="

### Subjectification

- The process through which students discover themselves and their voice 
- Discussion, writing essays, holding debates, trying new things, playing with ideas are all ways to grow as an individual
- GenAI can limit opportunities for this process by decreasing the time spent making stuff
</div></script></section><section data-separator="

## So is GenAI all bad for education?

- Probably not, but as it _can_ negatively impact all three domains of purpose, the technology should be approached with care
- This is even without considering broader political-economical issues with the technology
- Integration into higher education should at the very least be conditional  on _clear added value_ for teachers and learners
</div></script></section><section data-separator="

## GenAI is not inevitable in higher education

- Does this technology (context-dependent probabilistic token prediction) even fit with (truth-oriented) knowledge work?
- Are the cognitive costs on users offset by any productive benefits?
- Is GenAI output or its societal impact in line with academic norms and values?
- Olivia Guest would say no to all of these: https://olivia.science/ai/

## Closing

- Education is not about producing papers or doing assignments
- It is about the real benefits of **qualification**, **socialisation** and **subjectification**
- The key questions about GenAI in education are:
	1. where GenAI can support these purposes and where it could obstruct them
	2. what the societal consequences of (not) integrating GenAI are

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom
            plugins: [
                ObsidianMarkdown,
                RevealHighlight,
                RevealZoom,
                RevealNotes,
                RevealMath.KaTeX,
                RevealMermaid,
                RevealChart,
                RevealCustomControls,
            ],
            allottedTime: "120",

            katex: {
                local: 'plugin/math/katex',
                extensions: ["mhchem"],
            },
            markdown: {
                gfm: true,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                    {
                        id: 'toggle-overview',
                        title: 'Toggle overview (O)',
                        icon: '<i class="fa fa-th"></i>',
                        action: 'Reveal.toggleOverview();'
                    },
                ]
            },
        };

        if ( pageInIframe() ) {
            defaultOptions.scrollActivationWidth = 5;
        }

        // options from URL query string
        const queryOptions = Reveal().getQueryHash() || {};

        const options = extend(defaultOptions, {"controls":true,"progress":true,"slideNumber":true,"center":true,"transition":"none","transitionSpeed":"default","width":960,"height":700,"margin":0.04}, queryOptions);
    </script>
